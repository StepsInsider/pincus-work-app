name: Flutter Web Build

on:
  push:
    branches:
      - main
      - audit-v2-20260821
      - fix/ci-build-20260821
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Flutter Version
        run: |
          set -euo pipefail
          flutter --version
          dart --version

      - name: Install Dependencies
        run: |
          set -euo pipefail
          flutter pub get

      - name: Analyze Code
        run: |
          set -euo pipefail
          flutter analyze

      - name: Run Tests
        run: |
          set -euo pipefail
          flutter test

      - name: Validate Supabase Configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "ERROR: SUPABASE_URL secret is not configured"; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "ERROR: SUPABASE_PUBLISHABLE_KEY secret is not configured"; exit 1; }
          echo "Supabase configuration secrets are present."

      - name: Build Web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          flutter build web --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Verify Build Output
        run: |
          set -euo pipefail
          test -f build/web/index.html
          test -d build/web/assets
          echo "Flutter web build output verified."

      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: build/web
