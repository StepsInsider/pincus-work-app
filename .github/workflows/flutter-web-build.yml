name: Flutter Web Build

on:
  push:
    branches:
      - main
      - audit-v2-20260821
      - fix/ci-harden
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Analyze, Test and Build Flutter Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter 3.44.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Show Flutter and Dart Versions
        run: |
          set -euo pipefail
          flutter --version
          dart --version

      - name: Verify Lockfile
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f pubspec.lock
          echo "pubspec.yaml and pubspec.lock found."

      - name: Install Dependencies
        run: |
          set -euo pipefail
          flutter pub get

      - name: Analyze Code
        run: |
          set -euo pipefail
          flutter analyze

      - name: Run Tests
        run: |
          set -euo pipefail
          flutter test

      - name: Validate Supabase Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: SUPABASE_URL secret is missing."
            exit 1
          fi

          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "ERROR: SUPABASE_PUBLISHABLE_KEY secret is missing."
            exit 1
          fi

          echo "Supabase secrets are configured."

      - name: Build Web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          flutter build web --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Verify Web Build
        run: |
          set -euo pipefail
          test -f build/web/index.html
          test -d build/web/assets
          echo "Flutter Web build verified successfully."

      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: build/web
          if-no-files-found: error

